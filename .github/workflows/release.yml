name: Build, test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate tagged version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/cloudflarednew.csproj
          if ("v$($project.Project.PropertyGroup.Version)" -ne "${{ github.ref_name }}") { throw "Tag must match project version" }
      - name: Build standalone executable
        shell: pwsh
        run: ./build.ps1
      - name: Build fake engine
        run: dotnet build tests/FakeEngine -c Release
      - name: Multi-worker integration checks
        shell: powershell
        run: ./tests/Integration.ps1
      - name: Windows service lifecycle checks
        shell: powershell
        run: ./tests/ServiceLifecycle.ps1
      - name: Package
        shell: pwsh
        run: ./scripts/Package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: |
            dist/cloudflared.exe
            dist/multicloudflared-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-release
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "MultiCloudflared $RELEASE_TAG" --notes "Download multicloudflared-windows-x64.zip, extract it and run Install.cmd. Or download cloudflared.exe and run service install with your tunnel token. Official Cloudflared engine downloads automatically with SHA-256 verification. See the README for setup, updates and removal."
